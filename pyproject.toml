[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gear-nav"
version = "0.1.0"
description = "GEAR-Nav navigation research stack"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Yohan Abeysinghe" }]
dependencies = [
    "matplotlib==3.10.9",
    "openpi",
    "optax==0.2.8",
    "pyyaml==6.0.3",
    "wandb==0.26.1",
]

[project.urls]
Repository = "https://github.com/YohanAbeysinghe/GEAR-Nav"

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff>=0.8.6",
]

[project.scripts]
gear-nav-train = "gear_nav.training.aggregation:cli"
astar-train = "gear_nav.training.aggregation:cli"
gear-nav-train-distributed = "gear_nav.training.distributed:main"
astar-train-distributed = "gear_nav.training.distributed:main"
gear-nav-eval = "gear_nav.evaluation.aggregation:cli"
astar-eval = "gear_nav.evaluation.aggregation:cli"
gear-nav-download-pi05 = "gear_nav.tools.download_pi05:main"
astar-download-pi05 = "gear_nav.tools.download_pi05:main"
gear-nav-verify = "gear_nav.tools.verify_installation:main"
astar-verify = "gear_nav.tools.verify_installation:main"
gear-nav-wandb-sidecar = "gear_nav.tools.wandb_sidecar:main"
astar-wandb-sidecar = "gear_nav.tools.wandb_sidecar:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["manual: long-running or multi-process test"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F722"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-third-party = ["wandb"]

[tool.uv.sources]
openpi = { path = "third_party/openpi", editable = true }
openpi-client = { path = "third_party/openpi/packages/openpi-client", editable = true }

[tool.uv]
override-dependencies = [
    "ml-dtypes==0.4.1",
    "tensorstore==0.1.74",
]
